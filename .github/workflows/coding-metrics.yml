# Visit https://github.com/lowlighter/metrics#-documentation for full reference

name: Metrics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  github-metrics:
    name: GitHub Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write # For committing the updated SVG file

    steps:
      - name: Coding Metrics
        # Upstream has no release tags; pin the selected commit.
        uses: JackPlowman/coding-metrics@c9fa9bb2169c251560fbaf18e16b83f155d7d530 # zizmor: ignore[stale-action-refs]
        with:
          github_token: ${{ secrets.GH_TOKEN }} # zizmor: ignore[secrets-outside-env]
          output_file_name: github-metrics.svg
          colour_profile: dark
